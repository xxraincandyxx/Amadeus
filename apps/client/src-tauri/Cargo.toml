[package]
name = "Amadeus"
version = "0.2.0"
description = "Native macOS client for the Amadeus agent runtime"
authors = ["Amadeus contributors"]
edition = "2021"
license = "MIT"
repository = "https://github.com/xxraincandyxx/Amadeus"

[lib]
name = "amadeus_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
window-vibrancy = "0.5"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSImage"] }
objc2-foundation = { version = "0.3", features = ["NSString"] }

[workspace]
